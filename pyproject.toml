[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meter-reading-inference-service"
version = "0.1.0"
description = "FastAPI Inference and Inspection Adapter for frozen meter-reading-engine-v2"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "Technical Demo Team" }
]
dependencies = [
    "meter-reading-engine @ git+https://github.com/KwanFam26022005/meter-reading-engine-v2.git@a68bd884ae2b023fdeadd1ccefe25524a995f080",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.1",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/meter_reading_inference_service"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
